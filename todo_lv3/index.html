<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ToDo App Lv.3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="margin: 0;">
    <div style="margin: 60px 20%;">
        <h1 style="margin-bottom: 20px;">ToDo App Lv.3</h1>
        <div
            style="border: 1px solid #bdbdbd; border-radius: 10px; padding: 20px; margin-top: 20px; margin-bottom: 25px;">
            <div style="padding-bottom: 8px; margin-bottom: 15px; font-weight: bold;">
                ToDo登録</div>
            <hr style="margin-left: -20px; margin-right: -20px; border-color: #bebebe;">
            <div style="margin-bottom: 15px;">
                <span class="form-label">タスク名</span>
                <input type="text" id="addTask" name="task" class="form-control" placeholder="タスクを入力してください">
            </div>
            <div class="row" style="margin-bottom: 15px;">
                <div class="col-md-6">
                    <span class="form-label">期限日</span>
                    <input type="date" id="dueDate" class="form-control" placeholder="年/月/日">
                </div>
                <div class="col-md-6">
                    <span class="form-label">制限時間</span>
                    <select id="dueTime" class="form-select">
                        <option value="">時間を選択</option>
                    </select>
                </div>
            </div>
            <button id="addBtn" class="btn btn-primary btn-sm" style="width: 60px;">追加</button>
        </div>

        <div
            style="border: 1px solid #bdbdbd; border-radius: 10px; padding: 20px; margin-top: 20px; margin-bottom: 25px;">
            <div style="padding-bottom: 8px; margin-bottom: 15px; font-weight: bold;">
                検索・絞り込み・並び替え</div>
            <hr style="margin-left: -20px; margin-right: -20px; border-color: #bebebe;">
            <div class="row" style="margin-bottom: 15px;">
                <div class="col-md-4">
                    <span class="form-label">キーワード</span>
                    <input type="text" id="keyword" class="form-control" placeholder="タスクを検索">
                </div>
                <div class="col-md-4">
                    <span class="form-label">状態</span>
                    <select id="statusSelect" class="form-select">
                        <option value="all">すべて</option>
                        <option value="incompleted">未完了</option>
                        <option value="completed">完了</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <span class="form-label">並び順</span>
                    <select id="sortSelect" class="form-select">
                        <option value="added">追加順</option>
                        <option value="dueAsc">期限が近い順</option>
                        <option value="dueDesc">期限が遠い順</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row" style="margin-bottom: 20px;">
            <div class="col-md-4">
                <div
                    style="text-align: center; padding: 10px; border-radius: 6px; color: #080808; background-color: #b0cbe6;">
                    <p style="margin: 0;">全て：<span id="allTasksNumber">0</span>件</p>
                </div>
            </div>
            <div class="col-md-4">
                <div
                    style="text-align: center; padding: 10px; border-radius: 6px; color: #080808; background-color: #fff3cd;">
                    <p style="margin: 0;">未完了：<span id="incompletedTasksNumber">0</span>件</p>
                </div>
            </div>
            <div class="col-md-4">
                <div
                    style="text-align: center; padding: 10px; border-radius: 6px; color: #080808; background-color: #abe0d9;">
                    <p style="margin: 0;">完了：<span id="completedTasksNumber">0</span>件</p>
                </div>
            </div>
        </div>

        <div style="border: 1px solid #a7a7a7; border-radius: 10px; padding: 20px;">
            <p style="margin-bottom: 15px; font-weight: bold;">ToDo一覧</p>
            <ul id="taskList" class="list-unstyled"></ul>
            <hr style="margin-left: -20px; margin-right: -20px; border-color: #bebebe;">
            <div
                style="margin-top: -10px; margin-bottom: -10px; display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <div>
                    <div>タスク表示例（はりぼて）</div>
                    <div style="font-size: 0.8rem; color: #6c757d;">期限：2026/10/14 11:00</div>
                </div>
                <div style="text-align: right; display: flex; gap: 5px;">
                    <button id="isDoneBtn00" class="btn btn-success"
                        style="white-space: nowrap; width: auto;">完了</button>
                    <button id="editBtn00" class="btn btn-primary" style="white-space: nowrap; width: auto;">編集</button>
                    <button id="deleteBtn00" class="btn btn-danger"
                        style="white-space: nowrap; width: auto;">削除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
