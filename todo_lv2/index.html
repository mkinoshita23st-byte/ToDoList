<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ToDo App Lv.1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="content">
        <h1>ToDo App Lv.1</h1>
        <div class="input-group add-task">
            <input type="text" id="addTask" name="task" class="form-control" placeholder="タスクを入力してください">
            <button id="addBtn" class="btn btn-primary">追加</button>
        </div>
        <div class="number d-flex flex-row">
            <div id="allTasks" class="number-display all-task-number flex-fill">
                <p>全て：<span id="allTasksNumber">0</span>件</p>
            </div>
            <div id="incompletedTasks" class="number-display incompleted-task-number flex-fill">
                <p>未完了：<span id="incompletedTasksNumber">0</span>件</p>
            </div>
            <div id="completedTasks" class="number-display completed-task-number flex-fill">
                <p>完了：<span id="completedTasksNumber">0</span>件</p>
            </div>
        </div>
        <div class="task-display-btn btn-group">
            <button id="allTasksBtn" class="btn btn-outline-primary">すべて</button>
            <button id="incompletedTasksBtn" class="btn btn-outline-primary">未完了</button>
            <button id="completedTasksBtn" class="btn btn-outline-primary">完了</button>
        </div>
        <div class="list">
            <p>ToDo一覧</p>
            <ul id="taskList" class="list-unstyled"></ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
